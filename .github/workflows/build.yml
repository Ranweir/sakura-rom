name: Build FlymeOS 10 (Android 13) for Redmi 6 Pro (Sakura)

on: [push, workflow_dispatch]

jobs:
  port_flyme:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Free Up 45GB+ Disk Space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: 2. Install All Unpacking & Image Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 brotli zstd unzip zip p7zip-full python3 python3-pip \
            android-sdk-libsparse-utils e2fsprogs erofs-utils xz-utils curl git wget file
          git clone https://github.com/xpirt/sdat2img.git ~/sdat2img
          git clone https://github.com/unix3dgforce/lpunpack.git ~/lpunpack

      - name: 3. Download Sakura Base ROM & FlymeOS 10 Donor
        run: |
          mkdir -p ~/work/{base,flyme_port,rootfs,mnt_ven,mnt_sys,mnt_base_sys,out}
          cd ~/work

          echo "Downloading Sakura A13 Base ROM (LineageOS 20)..."
          aria2c -x16 -s16 -k1M -o base.zip "https://github.com/ItsVixano-releases/LineageOS_sakura/releases/download/20231012/lineage-20.0-20231012-UNOFFICIAL-sakura.zip"

          echo "Downloading FlymeOS 10 (Android 13) Donor Image..."
          # Automatic Fallback Mirrors for FlymeOS 10 A13 AB Port/GSI
          URLS=(
            "https://downloads.sourceforge.net/project/ nippon-gsi/FlymeOS-A13/Flyme-10.3.0.0A-20230516-NipponGSI.img.gz"
            "https://downloads.sourceforge.net/project/mystic-gsi-updates/FlymeOS/Flyme-10.3.0.0A-AB-13-20230428-MysticGSI.img.gz"
            "https://github.com/NazimAslantas/FlymeOS-GSI/releases/download/v10.0/FlymeOS-10-A13-AB-GSI.img.xz"
          )

          DOWNLOADED=0
          for url in "${URLS[@]}"; do
            clean_url=$(echo "$url" | tr -d ' ')
            echo "Trying mirror: $clean_url"
            if aria2c -x16 -s16 -k1M --max-tries=3 --timeout=30 -o flyme_donor.archive "$clean_url"; then
              if [ -s flyme_donor.archive ] && [ $(stat -c%s flyme_donor.archive) -gt 500000000 ]; then
                DOWNLOADED=1
                break
              fi
            fi
            rm -f flyme_donor.archive
          done

          if [ "$DOWNLOADED" -eq 0 ]; then
            echo "Fetching from SourceForge Direct Mirror..."
            wget -O flyme_donor.archive "https://master.dl.sourceforge.net/project/mystic-gsi-updates/FlymeOS/Flyme-10.3.0.0A-AB-13-20230428-MysticGSI.img.gz?viasf=1"
          fi

          ls -lh flyme_donor.archive

      - name: 4. Extract Base (boot.img, vendor.img, Base Camera) & Patch Vendor
        run: |
          cd ~/work
          unzip -q base.zip -d base/
          cp base/boot.img out/boot.img

          mkdir -p out/META-INF/com/google/android
          if [ -f base/META-INF/com/google/android/update-binary ]; then
            cp base/META-INF/com/google/android/update-binary out/META-INF/com/google/android/update-binary
            chmod 755 out/META-INF/com/google/android/update-binary
          fi

          # Extract Base Vendor
          if [ -f base/vendor.new.dat.br ]; then
            brotli -d base/vendor.new.dat.br -o base/vendor.new.dat
            python3 ~/sdat2img/sdat2img.py base/vendor.transfer.list base/vendor.new.dat out/vendor.img
          elif [ -f base/vendor.img ]; then
            cp base/vendor.img out/vendor.img
          fi

          # Extract Base System to salvage 100% Working Default Sakura Camera & Libs
          if [ -f base/system.new.dat.br ]; then
            brotli -d base/system.new.dat.br -o base/system.new.dat
            python3 ~/sdat2img/sdat2img.py base/system.transfer.list base/system.new.dat base/system.img
            sudo mount -o loop,ro base/system.img mnt_base_sys
            mkdir -p ~/work/saved_cam/{app,priv-app,etc}
            sudo cp -rfp mnt_base_sys/system/app/*Camera* ~/work/saved_cam/app/ 2>/dev/null || true
            sudo cp -rfp mnt_base_sys/system/priv-app/*Camera* ~/work/saved_cam/priv-app/ 2>/dev/null || true
            sudo cp -rfp mnt_base_sys/system/priv-app/*Snap* ~/work/saved_cam/priv-app/ 2>/dev/null || true
            sudo cp -rfp mnt_base_sys/system/etc/permissions/*camera* ~/work/saved_cam/etc/ 2>/dev/null || true
            sudo umount mnt_base_sys
          fi
          rm -rf base base.zip

          # Patch Vendor for Camera2API (HAL3), EIS & Smoothness
          e2fsck -fy out/vendor.img || true
          resize2fs out/vendor.img 950M
          sudo mount -o loop,rw out/vendor.img mnt_ven

          sudo tee -a mnt_ven/build.prop << 'EOF'
          persist.vendor.camera.HAL3.enabled=1
          persist.camera.HAL3.enabled=1
          persist.vendor.camera.eis.enable=1
          persist.vendor.camera.expose.aux=1
          vendor.camera.aux.packagelist=org.codeaurora.snapcam,com.android.camera,com.meizu.media.camera,org.lineageos.aperture
          camera.hal1.packagelist=none
          debug.sf.latch_unsignaled=1
          EOF

          sudo sed -i 's/fileencryption=ice/encryptable=footer/g' mnt_ven/etc/fstab.qcom || true
          sudo sed -i 's/forceencrypt=/encryptable=/g' mnt_ven/etc/fstab.qcom || true

          sudo umount mnt_ven
          e2fsck -fy out/vendor.img || true
          resize2fs -M out/vendor.img

      - name: 5. Unpack FlymeOS 10 Image into rootfs
        run: |
          cd ~/work
          FILE_TYPE=$(file -b flyme_donor.archive)
          echo "Archive type: $FILE_TYPE"

          if echo "$FILE_TYPE" | grep -qi "gzip"; then
            mv flyme_donor.archive flyme.img.gz
            gunzip -f flyme.img.gz
          elif echo "$FILE_TYPE" | grep -qi "XZ"; then
            mv flyme_donor.archive flyme.img.xz
            xz -d -T0 flyme.img.xz
          elif echo "$FILE_TYPE" | grep -qi "Zip"; then
            unzip -q flyme_donor.archive -d flyme_port/
            rm -f flyme_donor.archive
            FOUND_IMG=$(find flyme_port/ -name "*.img" | head -n 1)
            mv "$FOUND_IMG" flyme.img
          else
            mv flyme_donor.archive flyme.img
          fi

          # Convert if sparse image
          if file flyme.img | grep -qi "sparse"; then
            simg2img flyme.img flyme.raw.img
            mv flyme.raw.img flyme.img
          fi

          # Mount or Extract Flyme System
          if sudo mount -o loop,ro flyme.img mnt_sys 2>/dev/null; then
            sudo cp -rfp mnt_sys/* rootfs/
            sudo umount mnt_sys
          else
            sudo fsck.erofs --extract=rootfs flyme.img 2>/dev/null || 7z x flyme.img -orootfs -y >/dev/null 2>&1 || true
          fi
          rm -rf flyme.img flyme_port

      - name: 6. Debloat FlymeOS, Inject Default Camera & Enable Parallel Animations
        run: |
          cd ~/work
          echo "=== FlymeOS Size Before Cleaning ==="
          sudo du -sh rootfs/

          # 1. Remove Chinese Bloatware, Pedometers, Assistant, Pay, Browser, Heavy Videos & Pre-compiled OAT
          for bloat in Aicy VoiceAssistant MeizuPay WalletMz Browser Video MzUpdate Life Reader GameCenter Pedometer FamilyGuard Mall Community Feedback BugReport Suggestion; do
            sudo find rootfs/ -iname "*${bloat}*" -exec rm -rf {} + 2>/dev/null || true
          done

          sudo find rootfs/ -iname "*nfc*" -exec rm -rf {} + 2>/dev/null || true
          sudo find rootfs/ -iname "*tts*" -exec rm -rf {} + 2>/dev/null || true
          sudo find rootfs/ -name "oat" -type d -exec rm -rf {} + 2>/dev/null || true
          sudo find rootfs/ -name "*.vdex" -type f -delete 2>/dev/null || true
          sudo find rootfs/ -name "*.odex" -type f -delete 2>/dev/null || true
          sudo find rootfs/ -name "*.art" -type f -delete 2>/dev/null || true
          sudo find rootfs/ -name "*.mp4" -type f -delete 2>/dev/null || true

          # 2. Inject Working Default Sakura Camera (Aperture/Snapcam) alongside Flyme Camera
          SYS="rootfs/system"
          sudo mkdir -p $SYS/app $SYS/priv-app $SYS/etc/permissions
          if [ -d ~/work/saved_cam/app ]; then
            sudo cp -rfp ~/work/saved_cam/app/* $SYS/app/ 2>/dev/null || true
          fi
          if [ -d ~/work/saved_cam/priv-app ]; then
            sudo cp -rfp ~/work/saved_cam/priv-app/* $SYS/priv-app/ 2>/dev/null || true
          fi
          if [ -d ~/work/saved_cam/etc ]; then
            sudo cp -rfp ~/work/saved_cam/etc/* $SYS/etc/permissions/ 2>/dev/null || true
          fi

          # 3. FlymeOS 10 Smooth Parallel Animations + Control Center Blur + Camera HAL3 Tweaks
          sudo tee -a $SYS/build.prop << 'EOF'

          # --- FlymeOS 10 Sakura Port Tweaks ---
          ro.product.system.device=sakura
          ro.product.system.model=Redmi 6 Pro
          ro.build.Flyme.SplitScreen=true

          # Default Camera HAL3 Fix
          persist.vendor.camera.HAL3.enabled=1
          persist.camera.HAL3.enabled=1
          persist.vendor.camera.eis.enable=1
          vendor.camera.aux.packagelist=org.codeaurora.snapcam,com.android.camera,com.meizu.media.camera,org.lineageos.aperture
          camera.hal1.packagelist=none

          # Real-Time Gaussian Blur & Smooth Parallel Animations
          ro.surface_flinger.supports_background_blur=1
          persist.sys.background_blur_supported=true
          persist.sys.background_blur_status_default=true
          debug.sf.enable_gl_backpressure=1
          debug.sf.latch_unsignaled=1
          debug.hwui.renderer=skiagl
          persist.sys.ui.hw=true
          windowsmgr.max_events_per_sec=150
          ro.min_pointer_dur=8
          EOF

          echo "=== FlymeOS Size After Cleaning ==="
          sudo du -sh rootfs/

      - name: 7. Build <2950MB System Image & Package Flashable Zip
        run: |
          cd ~/work
          USED_MB=$(sudo du -sm rootfs | cut -f1)
          IMG_MB=$((USED_MB + 150))

          if [ "$IMG_MB" -gt 2950 ]; then
            IMG_MB=2950
          fi

          echo "=== Final Used Space: ${USED_MB}MB | Creating system.img of ${IMG_MB}MB ==="
          sudo mkfs.ext4 -F -L / -d rootfs -O ^metadata_csum,^64bit out/system.img "${IMG_MB}M"
          sudo rm -rf rootfs
          e2fsck -fy out/system.img || true
          resize2fs -M out/system.img || true

          ls -lh out/

          cat << 'EOF' > out/META-INF/com/google/android/updater-script
          ui_print("==========================================");
          ui_print("   FlymeOS 10 (Android 13) for Sakura     ");
          ui_print("   Alive Design | Smooth Parallel Anim    ");
          ui_print("   Default Camera + Control Center Blur   ");
          ui_print("==========================================");
          ui_print("-> Flashing Kernel (boot.img)...");
          package_extract_file("boot.img", "/dev/block/bootdevice/by-name/boot");
          ui_print("-> Flashing Patched HAL3 Vendor...");
          package_extract_file("vendor.img", "/dev/block/bootdevice/by-name/vendor");
          ui_print("-> Flashing FlymeOS 10 System...");
          package_extract_file("system.img", "/dev/block/bootdevice/by-name/system");
          ui_print("-> Done! Format Data if coming from another ROM.");
          EOF

          cd out
          zip -r1 ~/FlymeOS10_Sakura_A13_Port.zip boot.img vendor.img system.img META-INF/
          ls -lh ~/FlymeOS10_Sakura_A13_Port.zip

      - name: 8. Upload Flashable ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlymeOS10_Sakura_A13_Port
          path: ~/FlymeOS10_Sakura_A13_Port.zip
          retention-days: 5
