name: Build MIUI 14 Xiaomi.eu for Redmi 6 Pro (Sakura)

on: [push, workflow_dispatch]

jobs:
  port_rom:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Free Up 45GB+ Disk Space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: 2. Install All Unpacking & Image Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 brotli zstd unzip zip p7zip-full python3 python3-pip \
            android-sdk-libsparse-utils e2fsprogs erofs-utils curl git wget file
          git clone https://github.com/xpirt/sdat2img.git ~/sdat2img
          git clone https://github.com/unix3dgforce/lpunpack.git ~/lpunpack
          wget -q https://github.com/erfanoabdi/ErfanGSIs/raw/master/tools/lpunpack -O ~/lpunpack_bin || true
          chmod +x ~/lpunpack_bin || true

      - name: 3. Download Sakura Base ROM & Xiaomi.eu MIUI 14 Donor
        run: |
          mkdir -p ~/work/{base,eu_port,super_ext,rootfs,mnt_ven,mnt_ext_sys,out}
          cd ~/work
          echo "Downloading Sakura A13 Base ROM (LineageOS 20)..."
          aria2c -x16 -s16 -k1M -o base.zip "https://github.com/ItsVixano-releases/LineageOS_sakura/releases/download/20231012/lineage-20.0-20231012-UNOFFICIAL-sakura.zip"
          echo "Downloading Xiaomi.eu MIUI 14 (spes) Port ROM..."
          aria2c -x16 -s16 -k1M -o port.zip "https://downloads.sourceforge.net/project/xiaomi-eu-multilang-miui-roms/xiaomi.eu/MIUI-STABLE-RELEASES/MIUIv14/xiaomi.eu_multi_HMNote11_V14.0.6.0.TGKMIXM_v14-13.zip"

      - name: 4. Extract Base (boot.img, vendor.img & update-binary) and Patch Vendor
        run: |
          cd ~/work
          unzip -q base.zip -d base/
          cp base/boot.img out/boot.img

          mkdir -p out/META-INF/com/google/android
          if [ -f base/META-INF/com/google/android/update-binary ]; then
            cp base/META-INF/com/google/android/update-binary out/META-INF/com/google/android/update-binary
            chmod 755 out/META-INF/com/google/android/update-binary
          fi

          if [ -f base/vendor.new.dat.br ]; then
            brotli -d base/vendor.new.dat.br -o base/vendor.new.dat
            python3 ~/sdat2img/sdat2img.py base/vendor.transfer.list base/vendor.new.dat out/vendor.img
          elif [ -f base/vendor.img ]; then
            cp base/vendor.img out/vendor.img
          fi
          rm -rf base base.zip

          e2fsck -fy out/vendor.img || true
          resize2fs out/vendor.img 950M
          sudo mount -o loop,rw out/vendor.img mnt_ven

          sudo tee -a mnt_ven/build.prop << 'EOF'
          persist.vendor.camera.HAL3.enabled=1
          persist.camera.HAL3.enabled=1
          persist.vendor.camera.eis.enable=1
          persist.camera.expose.aux=1
          vendor.camera.aux.packagelist=org.codeaurora.snapcam,com.android.camera,com.miui.camera
          camera.hal1.packagelist=none
          EOF

          sudo sed -i 's/fileencryption=ice/encryptable=footer/g' mnt_ven/etc/fstab.qcom || true
          sudo sed -i 's/forceencrypt=/encryptable=/g' mnt_ven/etc/fstab.qcom || true

          sudo umount mnt_ven
          e2fsck -fy out/vendor.img || true
          resize2fs -M out/vendor.img

      - name: 5. Merge Split super.img.0-N Chunks & Unpack into Folder
        run: |
          cd ~/work
          unzip -q port.zip "images/super.img*" -d eu_port/ || unzip -q port.zip -d eu_port/
          rm -f port.zip
          mkdir -p super_ext

          SUPER_CHUNKS=$(find eu_port/ -name "super.img*" | sort -V)
          simg2img $SUPER_CHUNKS eu_port/super.raw.img
          rm -rf eu_port/images

          python3 ~/lpunpack/lpunpack.py eu_port/super.raw.img super_ext/ || ~/lpunpack_bin eu_port/super.raw.img super_ext/
          rm -f eu_port/super.raw.img

          for part in system product system_ext mi_ext; do
            IMG=$(find super_ext/ -name "${part}_a.img" -o -name "${part}.img" | head -n 1)
            if [ -n "$IMG" ] && [ -s "$IMG" ]; then
              mkdir -p ~/work/extracted_${part}
              if sudo mount -o loop,ro "$IMG" ~/work/mnt_ext_sys 2>/dev/null; then
                sudo cp -rfp ~/work/mnt_ext_sys/* ~/work/extracted_${part}/
                sudo umount ~/work/mnt_ext_sys
              else
                sudo fsck.erofs --extract=~/work/extracted_${part} "$IMG" 2>/dev/null || \
                7z x "$IMG" -o~/work/extracted_${part} -y >/dev/null 2>&1 || true
              fi
              rm -f "$IMG"
            fi
          done

          echo "=== Merging Partitions into rootfs Directory ==="
          sudo cp -rfp ~/work/extracted_system/* rootfs/
          sudo rm -rf rootfs/product rootfs/system/product rootfs/system_ext rootfs/system/system_ext
          sudo mkdir -p rootfs/system/product rootfs/system/system_ext

          if [ -d ~/work/extracted_product ]; then
            sudo cp -rfp ~/work/extracted_product/* rootfs/system/product/ || true
          fi
          if [ -d ~/work/extracted_system_ext ]; then
            sudo cp -rfp ~/work/extracted_system_ext/* rootfs/system/system_ext/ || true
          fi
          if [ -d ~/work/extracted_mi_ext/product ]; then
            sudo cp -rfp ~/work/extracted_mi_ext/product/* rootfs/system/product/ || true
          fi
          if [ -d ~/work/extracted_mi_ext/system ]; then
            sudo cp -rfp ~/work/extracted_mi_ext/system/* rootfs/system/ || true
          fi

          sudo ln -sf /system/product rootfs/product
          sudo ln -sf /system/system_ext rootfs/system_ext
          sudo rm -rf super_ext ~/work/extracted_*

      - name: 6. Universal Deep Clean & Remove Heavy Bloat across rootfs
        run: |
          cd ~/work
          echo "Size before deep cleaning:"
          sudo du -sh rootfs/

          # 1. Universally find and remove all SuperWallpapers, AOD, heavy media, themes, wallpapers
          sudo find rootfs/ -iname "*superwallpaper*" -exec rm -rf {} + 2>/dev/null || true
          sudo find rootfs/ -iname "*alwaysondisplay*" -exec rm -rf {} + 2>/dev/null || true
          sudo find rootfs/ -iname "*wallpaper*" -type d -exec rm -rf {} + 2>/dev/null || true
          sudo find rootfs/ -iname "*theme*" -type d -exec rm -rf {} + 2>/dev/null || true
          
          # 2. Remove audio/media/ringtone folders completely
          sudo find rootfs/ -type d -name "media" -exec rm -rf {} + 2>/dev/null || true
          sudo find rootfs/ -type d -name "ringtone*" -exec rm -rf {} + 2>/dev/null || true
          sudo find rootfs/ -type d -name "alarm*" -exec rm -rf {} + 2>/dev/null || true
          sudo find rootfs/ -type d -name "notification*" -exec rm -rf {} + 2>/dev/null || true

          # 3. Universally remove non-essential bloatware apps by name anywhere in rootfs
          for app in MiBrowser MiMover Health Updater YouTube Maps Drive Gmail2 Photos Music2 Videos Velvet Duo Chrome talkback Notes Calculator Weather MiRecorder MiCalendar Scanner ScreenRecorder YellowPage QuickApp Turbo GameCenter MiShare VoiceTrigger SoundRecorder MiuiBugReport HybridPlatform Joyose Mipay MiuiVideoGlobal MSA AnalyticsCore BasicDreams PhotoTable EasterEgg BookmarkProvider CatchLog Traceur BackupRestoreConfirmation CallLogBackup SharedStorageBackup Tag UserDictionaryProvider GoogleTTS MarkupGoogle PrintSpooler BuiltInPrintService MiuiExtraPhoto; do
            sudo find rootfs/ -iname "*${app}*" -exec rm -rf {} + 2>/dev/null || true
          done

          # 4. Remove pre-compiled oat/vdex/art files to save massive space (~1.5GB)
          sudo find rootfs/ -name "oat" -type d -exec rm -rf {} + 2>/dev/null || true
          sudo find rootfs/ -name "*.vdex" -type f -delete 2>/dev/null || true
          sudo find rootfs/ -name "*.odex" -type f -delete 2>/dev/null || true
          sudo find rootfs/ -name "*.art" -type f -delete 2>/dev/null || true

          echo "Size after universal deep cleaning:"
          sudo du -sh rootfs/

          # 5. Inject Sakura Device Features XML
          SYS="rootfs/system"
          PROD="rootfs/system/product"
          sudo mkdir -p $SYS/etc/device_features $PROD/etc/device_features
          sudo tee $SYS/etc/device_features/sakura.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <features>
              <bool name="is_xiaomi">false</bool>
              <bool name="is_redmi">true</bool>
              <string name="support_device_name">Redmi 6 Pro</string>
              <integer name="cpu_max_freq">200</integer>
              <bool name="support_dual_sd_card">true</bool>
              <bool name="support_camera_4k_quality">true</bool>
              <bool name="support_camera_audio_focus">false</bool>
              <bool name="support_camera_manual_function">true</bool>
              <bool name="support_camera_press_down_capture">true</bool>
              <bool name="support_camera_torch_capture">true</bool>
              <bool name="support_camera_portrait">true</bool>
              <bool name="is_support_portrait">true</bool>
              <bool name="support_front_bokeh">true</bool>
              <bool name="support_camera_square_mode">true</bool>
              <bool name="support_camera_aohdr">true</bool>
              <bool name="support_camera_hfr">true</bool>
              <bool name="support_camera_gradienter">true</bool>
              <bool name="support_camera_peaking_mf">true</bool>
              <bool name="is_legacy_face_beauty">false</bool>
              <integer name="camera_reduce_preview_flag">14</integer>
              <bool name="support_screen_effect">true</bool>
              <bool name="support_autobrightness_optimize">true</bool>
          </features>
          EOF

          sudo cp $SYS/etc/device_features/sakura.xml $PROD/etc/device_features/sakura.xml
          sudo ln -sf sakura.xml $SYS/etc/device_features/spes.xml
          sudo ln -sf sakura.xml $SYS/etc/device_features/spesn.xml
          sudo ln -sf sakura.xml $PROD/etc/device_features/spes.xml
          sudo ln -sf sakura.xml $PROD/etc/device_features/spesn.xml

          # 6. Camera Permissions
          sudo mkdir -p $SYS/etc/permissions
          sudo tee $SYS/etc/permissions/privapp-permissions-miuicamera.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <privapp-permissions package="com.android.camera">
                  <permission name="android.permission.CAMERA"/>
                  <permission name="android.permission.INTERACT_ACROSS_USERS"/>
                  <permission name="android.permission.WRITE_MEDIA_STORAGE"/>
                  <permission name="android.permission.WRITE_SECURE_SETTINGS"/>
                  <permission name="android.permission.MOUNT_UNMOUNT_FILESYSTEMS"/>
                  <permission name="android.permission.READ_FRAME_BUFFER"/>
                  <permission name="android.permission.SYSTEM_CAMERA"/>
              </privapp-permissions>
          </permissions>
          EOF

          # 7. Build.prop Tweaks (Camera HAL3 + Smooth Parallel Animations + Blur)
          sudo sed -i 's/ro.product.system.device=.*/ro.product.system.device=sakura/g' $SYS/build.prop || true
          sudo sed -i 's/ro.product.system.name=.*/ro.product.system.name=sakura/g' $SYS/build.prop || true
          sudo tee -a $SYS/build.prop << 'EOF'
          ro.product.mod_device=sakura_xiaomi_eu
          ro.miui.notch=1
          persist.vendor.camera.HAL3.enabled=1
          persist.camera.HAL3.enabled=1
          persist.vendor.camera.eis.enable=1
          vendor.camera.aux.packagelist=org.codeaurora.snapcam,com.android.camera
          camera.hal1.packagelist=none
          ro.surface_flinger.supports_background_blur=1
          persist.sys.background_blur_supported=true
          persist.sys.background_blur_status_default=true
          persist.sys.background_blur_mode=0
          persist.sys.miui_animator_sched.bigcores=0-7
          persist.sys.miui_animator_sched.sched_threads=2
          persist.sys.miui.sf_cores=4-7
          EOF

      - name: 7. Build Exact <2.6GB System Image & Package Flashable Zip
        run: |
          cd ~/work
          USED_MB=$(sudo du -sm rootfs | cut -f1)
          IMG_MB=$((USED_MB + 150))

          if [ "$IMG_MB" -gt 2750 ]; then
            IMG_MB=2750
          fi

          echo "=== Final Used Space: ${USED_MB}MB | Creating system.img of ${IMG_MB}MB ==="
          sudo mkfs.ext4 -F -L / -d rootfs -O ^metadata_csum,^64bit out/system.img "${IMG_MB}M"
          sudo rm -rf rootfs
          e2fsck -fy out/system.img || true
          resize2fs -M out/system.img || true

          ls -lh out/

          cat << 'EOF' > out/META-INF/com/google/android/updater-script
          ui_print("==========================================");
          ui_print("   Xiaomi.eu MIUI 14 Port for Sakura      ");
          ui_print("   Android 13 | Smooth Parallel Anim      ");
          ui_print("==========================================");
          ui_print("-> Flashing Kernel (boot.img)...");
          package_extract_file("boot.img", "/dev/block/bootdevice/by-name/boot");
          ui_print("-> Flashing Patched HAL3 Vendor...");
          package_extract_file("vendor.img", "/dev/block/bootdevice/by-name/vendor");
          ui_print("-> Flashing Xiaomi.eu MIUI 14 System...");
          package_extract_file("system.img", "/dev/block/bootdevice/by-name/system");
          ui_print("-> Done! Format Data if coming from AOSP.");
          EOF

          cd out
          zip -r1 ~/MIUI14_EU_Sakura_A13_Port.zip boot.img vendor.img system.img META-INF/
          ls -lh ~/MIUI14_EU_Sakura_A13_Port.zip

      - name: 8. Upload Flashable ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIUI14_EU_Sakura_A13_Port
          path: ~/MIUI14_EU_Sakura_A13_Port.zip
          retention-days: 5
